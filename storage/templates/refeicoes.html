<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Refeições Detalhadas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --card-border: #f3f4f6;
            --card-shadow: rgba(0, 0, 0, 0.03);

            /* Cores dos Ícones de Refeição */
            --green-icon: #2c854b;
            --green-bg: #e6f9ed;
            --purple-icon: #8b5cf6;
            --purple-bg: #f3e8fc;
            --orange-icon: #d97706;
            --orange-bg: #fef3e6;

            /* Cores de Status e Ação */
            --status-green: #34c759;
            --danger-color: #ef4444;
            --danger-bg: #fef2f2;
            --edit-color: #3b82f6;
            --edit-bg: #eff6ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Fixed Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--card-border);
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
            color: var(--text-main);
        }

        /* Scrollable Content */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            padding-bottom: 3rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .page-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: -0.25rem;
        }

        /* Meal Card Base */
        .meal-card {
            border: 1px solid var(--card-border);
            border-radius: 12px;
            background-color: #ffffff;
            box-shadow: 0 4px 6px -1px var(--card-shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Estrutura Compacta da Refeição */
        .meal-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            background-color: #ffffff;
        }

        .meal-icon-bg {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .bg-green { background-color: var(--green-bg); }
        .bg-purple { background-color: var(--purple-bg); }
        .bg-orange { background-color: var(--orange-bg); }

        .meal-info {
            flex: 1;
        }

        .meal-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .meal-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .meal-stats {
            text-align: right;
            margin-right: 12px;
        }

        .meal-kcal {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .meal-kcal span {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .meal-macros {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .status-icon {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .dot-green { color: var(--status-green); font-size: 1.2rem; }
        .star-purple { color: var(--purple-icon); font-size: 1rem; }

        /* Lista de Alimentos com Divisor Parcial */
        .food-list {
            position: relative;
            padding: 1rem;
            background-color: #ffffff; /* Volta ao fundo branco */
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Linha sólida que não pega a div inteira */
        .food-list::before {
            content: "";
            position: absolute;
            top: 0;
            left: 1.5rem; /* Margem esquerda */
            right: 1.5rem; /* Margem direita */
            height: 1px;
            background-color: #f3f4f6; /* Cinza bem sutil */
        }

        .food-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .food-name {
            color: #4b5563;
            font-size: 0.8rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Ponto (bullet) cinza antes do alimento */
        .food-name::before {
            content: "";
            display: block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #d1d5db;
        }

        .food-qty {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 500;
            background-color: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Card Footer / Ações */
        .card-actions {
            display: flex;
            padding: 0.75rem 1rem;
            gap: 12px;
            background-color: #ffffff;
        }

        .btn-action {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 0;
            border-radius: 8px;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-action:active {
            opacity: 0.7;
        }

        .btn-action svg {
            width: 16px;
            height: 16px;
        }

        .btn-edit {
            background-color: var(--edit-bg);
            color: var(--edit-color);
        }

        .btn-delete {
            background-color: var(--danger-bg);
            color: var(--danger-color);
        }

        /* Rodapé / Legenda */
        .footer-legend {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--card-border);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

    </style>
</head>
<body>

<div class="mobile-container">
    <header>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        <h1>Últimas refeições</h1>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </header>

    <div class="scroll-area" id="meals-container">
        <!-- O conteúdo será injetado aqui via JavaScript -->
    </div>
</div>

<script>
    const mealIcons = {
        lunch: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--green-icon)" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 10h8M8 14h4"/></svg>`,
        breakfast: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--purple-icon)" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/></svg>`,
        snack: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--orange-icon)" stroke-width="2"><path d="M4 12a8 8 0 0 1 16 0"/><path d="M4 12h16"/></svg>`
    };

    const actionIcons = {
        edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`,
        trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`
    };

    const mealsData = [
        {
            id: 1,
            title: "Almoço",
            time: "12:45",
            iconType: "lunch",
            bgClass: "bg-green",
            macros: { kcal: 523, p: 38, g: 18, c: 56 },
            status: { type: "dot", class: "dot-green", symbol: "●" },
            items: [
                { name: "Arroz branco cozido", qtd: "150", unit: "g" },
                { name: "Feijão carioca", qtd: "100", unit: "g" },
                { name: "Peito de frango grelhado", qtd: "120", unit: "g" }
            ]
        },
        {
            id: 2,
            title: "Café da manhã",
            time: "08:15",
            iconType: "breakfast",
            bgClass: "bg-purple",
            macros: { kcal: 327, p: 16, g: 10, c: 45 },
            status: { type: "star", class: "star-purple", symbol: "★" },
            items: [
                { name: "Ovo", qtd: "2", unit: "unid." },
                { name: "Leite desnatado", qtd: "200", unit: "ml" },
                { name: "Pão integral", qtd: "2", unit: "fatias" }
            ]
        },
        {
            id: 3,
            title: "Lanche",
            time: "16:30",
            iconType: "snack",
            bgClass: "bg-orange",
            macros: { kcal: 150, p: 6, g: 5, c: 20 },
            status: { type: "star", class: "star-purple", symbol: "★" },
            items: [
                { name: "Iogurte natural", qtd: "1", unit: "unid." },
                { name: "Aveia em flocos", qtd: "30", unit: "g" }
            ]
        }
    ];

    function renderMeals() {
        const container = document.getElementById('meals-container');
        let html = '';

        mealsData.forEach(meal => {

            let itemsHtml = '';
            meal.items.forEach(item => {
                itemsHtml += `
                    <div class="food-row">
                        <span class="food-name">${item.name}</span>
                        <span class="food-qty">${item.qtd} ${item.unit}</span>
                    </div>
                `;
            });

            html += `
                <div class="meal-card" id="meal-${meal.id}">

                    <!-- Topo -->
                    <div class="meal-item">
                        <div class="meal-icon-bg ${meal.bgClass}">
                            ${mealIcons[meal.iconType]}
                        </div>
                        <div class="meal-info">
                            <div class="meal-name">${meal.title}</div>
                            <div class="meal-time">${meal.time}</div>
                        </div>
                        <div class="meal-stats">
                            <div class="meal-kcal">${meal.macros.kcal} <span>kcal</span></div>
                            <div class="meal-macros">P ${meal.macros.p}g &nbsp; G ${meal.macros.g}g &nbsp; C ${meal.macros.c}g</div>
                        </div>
                        <div class="status-icon ${meal.status.class}">${meal.status.symbol}</div>
                    </div>

                    <!-- Lista de Alimentos com Linha Sólida Parcial -->
                    <div class="food-list">
                        ${itemsHtml}
                    </div>

                    <!-- Rodapé: Ações -->
                    <div class="card-actions">
                        <button class="btn-action btn-edit" onclick="editMeal(${meal.id})">
                            ${actionIcons.edit} Editar
                        </button>
                        <button class="btn-action btn-delete" onclick="deleteMeal(${meal.id})">
                            ${actionIcons.trash} Excluir
                        </button>
                    </div>

                </div>
            `;
        });

        html += `
            <div class="footer-legend">
                <div class="legend-item">
                    <span class="dot-green">●</span> Dados de fontes confiáveis (BD / FatSecret)
                </div>
                <div class="legend-item">
                    <span class="star-purple">★</span> Estimativa por IA (baixa confiança)
                </div>
            </div>
        `;

        container.innerHTML = html;
    }

    function editMeal(id) {
        alert("Abrir modal de edição para a refeição ID: " + id);
    }

    function deleteMeal(id) {
        const confirmDelete = confirm("Tem certeza que deseja excluir esta refeição?");
        if (confirmDelete) {
            const card = document.getElementById(`meal-${id}`);
            if (card) {
                card.style.display = 'none';
            }
        }
    }

    document.addEventListener("DOMContentLoaded", renderMeals);
</script>

</body>
</html>
