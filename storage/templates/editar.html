<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Editar Metas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --card-border: #f3f4f6;
            --card-shadow: rgba(0, 0, 0, 0.03);

            /* Cores dos Ícones e Backgrounds */
            --kcal-color: #2c854b;
            --kcal-bg: #e6f9ed;

            --prot-color: #8b5cf6;
            --prot-bg: #f3e8fc;

            --fat-color: #d97706;
            --fat-bg: #fef3e6;

            --carb-color: #3b82f6;
            --carb-bg: #dbeafe;

            /* Cores de Ação (Estilo Editar) */
            --edit-color: #3b82f6;
            --edit-bg: #eff6ff;

            /* Cores de Sucesso (Salvo) */
            --success-color: #2c854b;
            --success-bg: #e6f9ed;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Fixed Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--card-border);
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
            color: var(--text-main);
        }

        /* Scrollable Content */
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            padding-bottom: 3rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .page-header {
            margin-bottom: 0.5rem;
        }

        .page-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .page-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Form Card Base */
        .edit-card {
            border: 1px solid var(--card-border);
            border-radius: 12px;
            background-color: #ffffff;
            box-shadow: 0 4px 6px -1px var(--card-shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .edit-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        .edit-row:last-child {
            border-bottom: none;
        }

        /* Lado esquerdo: Ícone + Info */
        .macro-label-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-box svg { width: 20px; height: 20px; }

        .bg-kcal { background-color: var(--kcal-bg); color: var(--kcal-color); }
        .bg-prot { background-color: var(--prot-bg); color: var(--prot-color); }
        .bg-fat { background-color: var(--fat-bg); color: var(--fat-color); }
        .bg-carb { background-color: var(--carb-bg); color: var(--carb-color); }

        .macro-info {
            display: flex;
            flex-direction: column;
        }

        .macro-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .macro-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Lado direito: Input Wrapper */
        .input-wrapper {
            display: flex;
            align-items: baseline;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 8px 12px;
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--edit-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .input-wrapper input {
            width: 54px;
            border: none;
            background: transparent;
            text-align: right;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
            font-family: 'Inter', sans-serif;
            padding: 0;
        }

        .input-kcal input {
            width: 65px;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .unit {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            margin-left: 4px;
        }

        /* Botão de Salvar (Estilo Editar: Fundo azul claro, texto azul) */
        .btn-save {
            width: 100%;
            background-color: var(--edit-bg);
            color: var(--edit-color);
            padding: 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0.5rem;
        }

        .btn-save:active {
            opacity: 0.7;
            transform: scale(0.98);
        }

        .btn-save svg {
            width: 20px;
            height: 20px;
        }

    </style>
</head>
<body>

<div class="mobile-container">
    <header>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <h1>Metas Pessoais</h1>
        <div style="width: 24px;"></div>
    </header>

    <div class="scroll-area">

        <div class="page-header">
            <h2 class="page-title">Ajustar Macros</h2>
            <p class="page-desc">Defina seus objetivos diários. Os gráficos de progresso e resumos do painel serão atualizados com base nestes valores.</p>
        </div>

        <div class="edit-card">

            <div class="edit-row">
                <div class="macro-label-group">
                    <div class="icon-box bg-kcal">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.66 11.2c-.23-.3-.51-.56-.77-.82-.67-.6-1.43-1.03-2.07-1.66C13.33 7.26 13 4.85 13.95 3c-.95.23-1.78.75-2.49 1.32-2.59 2.08-3.61 5.75-2.39 8.9.04.1.08.2.08.33 0 .22-.15.42-.35.5-.22.1-.46.04-.64-.12a.83.83 0 0 1-.22-.38c-.27-.87-.19-1.77.05-2.6.43-1.48 1.25-2.73 2.22-3.79-.37-.16-.76-.23-1.15-.23-2.72 0-5.18 2.14-5.55 4.96-.13.97.1 1.97.35 2.92.56 2.05 1.74 3.84 3.39 4.98 1.48 1.03 3.3 1.54 5.12 1.33 2.76-.32 5.06-2.32 5.76-4.96.22-.84.22-1.74-.04-2.58zM14 19.5c-1.35 0-2.54-.76-3.15-1.92-.06-.11-.03-.26.06-.34.1-.09.25-.09.36-.02.66.42 1.47.63 2.3.56.95-.08 1.83-.56 2.45-1.25.09-.1.24-.12.35-.05.11.07.13.22.06.33a4.01 4.01 0 0 1-2.43 2.69z"/></svg>
                    </div>
                    <div class="macro-info">
                        <span class="macro-name">Calorias</span>
                        <span class="macro-desc">Energia diária</span>
                    </div>
                </div>
                <div class="input-wrapper input-kcal">
                    <input type="number" id="input-kcal" value="2000" />
                    <span class="unit">kcal</span>
                </div>
            </div>

            <div class="edit-row">
                <div class="macro-label-group">
                    <div class="icon-box bg-prot">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.97 3.35c-1.43.32-2.8 1.1-3.8 2.19l-4.5 4.88c-.96 1.05-1.39 2.53-1.17 3.97.22 1.44 1.12 2.68 2.44 3.35l.93.47c1.32.67 2.87.65 4.18-.04l2.1-1.11c1.31-.69 2.19-1.97 2.37-3.45.18-1.48-.36-2.94-1.45-3.92l-1.1-1zM9.5 15.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                    </div>
                    <div class="macro-info">
                        <span class="macro-name">Proteína</span>
                        <span class="macro-desc">Construção muscular</span>
                    </div>
                </div>
                <div class="input-wrapper">
                    <input type="number" id="input-prot" value="120" />
                    <span class="unit">g</span>
                </div>
            </div>

            <div class="edit-row">
                <div class="macro-label-group">
                    <div class="icon-box bg-fat">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                    </div>
                    <div class="macro-info">
                        <span class="macro-name">Gordura</span>
                        <span class="macro-desc">Regulação hormonal</span>
                    </div>
                </div>
                <div class="input-wrapper">
                    <input type="number" id="input-fat" value="65" />
                    <span class="unit">g</span>
                </div>
            </div>

            <div class="edit-row">
                <div class="macro-label-group">
                    <div class="icon-box bg-carb">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21.36L20.5 2.86l.66.66c1.13 1.13 1.13 2.97 0 4.1l-1.32 1.32c-.8.8-2.02 1.02-3.05.57l-1.89-1.89-1.41 1.41 1.89 1.89c.45 1.03.23 2.25-.57 3.05l-1.32 1.32c-1.13 1.13-2.97 1.13-4.1 0l-.66-.66L2 21.36zM15.5 12c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5-1.5.67-1.5 1.5.67 1.5 1.5 1.5z"/></svg>
                    </div>
                    <div class="macro-info">
                        <span class="macro-name">Carboidrato</span>
                        <span class="macro-desc">Reserva de energia</span>
                    </div>
                </div>
                <div class="input-wrapper">
                    <input type="number" id="input-carb" value="250" />
                    <span class="unit">g</span>
                </div>
            </div>

        </div>

        <button class="btn-save" id="btn-save" onclick="salvarMetas()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Salvar Alterações
        </button>

    </div>
</div>

<script>
    function salvarMetas() {
        const btn = document.getElementById('btn-save');
        const originalText = btn.innerHTML;

        // Estilo suave de sucesso
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Salvo com sucesso!`;
        btn.style.backgroundColor = "var(--success-bg)";
        btn.style.color = "var(--success-color)";

        const metas = {
            kcal: document.getElementById('input-kcal').value,
            prot: document.getElementById('input-prot').value,
            fat: document.getElementById('input-fat').value,
            carb: document.getElementById('input-carb').value
        };

        console.log("Novas metas salvas:", metas);

        // Reseta o botão para as cores do CSS após 2 segundos
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.backgroundColor = "";
            btn.style.color = "";
        }, 2000);
    }
</script>

</body>
</html>
